<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bayti — خلّينا نعرفك</title>

    <link
      id="bootstrap-css"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <script src="../assets/i18n/ar.js"></script>
    <script src="../assets/i18n/en.js"></script>
    <script src="../assets/i18n/auth.i18n.js"></script>
    <script src="../assets/js/i18n.js"></script>
  </head>
  <body data-layout="auth">
    <header class="app-topbar">
      <a class="brand" href="../index.html"
        ><span class="brand-mark">B</span><span data-i18n="brand"></span
      ></a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button
          type="button"
          class="btn btn-link nav-lang px-2"
          data-action="toggle-lang"
        >
          <i class="bi bi-translate"></i><span data-i18n="lang.switch"></span>
        </button>
        <a
          href="../seeker/search.html"
          class="btn btn-sm btn-link text-muted text-decoration-none"
          data-i18n="auth.onb.skip"
        ></a>
      </div>
    </header>

    <main class="container py-4 py-lg-5">
      <!-- هلأ الخطوات الثلاث ظاهرين ورا بعض. بمرحلة الـ JS بنحولهم لـ wizard: خطوة وحدة كل مرة -->
      <form class="wizard" id="wizard">
        <!-- ===== الخطوة 1: ليش جاي ===== -->
        <section class="wizard-step" data-step="1">
          <span class="step-tag" data-i18n="auth.onb.step1"></span>
          <h1 class="h2" data-i18n="auth.onb.s1.title"></h1>
          <p class="text-muted mb-4" data-i18n="auth.onb.s1.sub"></p>

          <div class="row row-cols-2 row-cols-md-3 g-2 mb-4">
            <div class="col">
              <input
                type="checkbox"
                class="btn-check"
                name="purpose"
                id="pStudy"
                value="study"
                checked
              /><label class="choice-card align-items-center" for="pStudy"
                ><span class="ci"><i class="bi bi-mortarboard"></i></span
                ><b data-i18n="auth.onb.s1.study"></b
              ></label>
            </div>
            <div class="col">
              <input
                type="checkbox"
                class="btn-check"
                name="purpose"
                id="pWork"
                value="work"
              /><label class="choice-card align-items-center" for="pWork"
                ><span class="ci"><i class="bi bi-briefcase"></i></span
                ><b data-i18n="auth.onb.s1.work"></b
              ></label>
            </div>
            <div class="col">
              <input
                type="checkbox"
                class="btn-check"
                name="purpose"
                id="pTourism"
                value="tourism"
              /><label class="choice-card align-items-center" for="pTourism"
                ><span class="ci"><i class="bi bi-camera"></i></span
                ><b data-i18n="auth.onb.s1.tourism"></b
              ></label>
            </div>
            <div class="col">
              <input
                type="checkbox"
                class="btn-check"
                name="purpose"
                id="pMedical"
                value="medical"
              /><label class="choice-card align-items-center" for="pMedical"
                ><span class="ci"><i class="bi bi-hospital"></i></span
                ><b data-i18n="auth.onb.s1.medical"></b
              ></label>
            </div>
            <div class="col">
              <input
                type="checkbox"
                class="btn-check"
                name="purpose"
                id="pRelocation"
                value="relocation"
              /><label class="choice-card align-items-center" for="pRelocation"
                ><span class="ci"><i class="bi bi-truck"></i></span
                ><b data-i18n="auth.onb.s1.relocation"></b
              ></label>
            </div>
            <div class="col">
              <input
                type="checkbox"
                class="btn-check"
                name="purpose"
                id="pOther"
                value="other"
              /><label class="choice-card align-items-center" for="pOther"
                ><span class="ci"><i class="bi bi-three-dots"></i></span
                ><b data-i18n="auth.onb.s1.other"></b
              ></label>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-md-7">
              <label
                class="form-label"
                data-i18n="auth.onb.s1.duration"
              ></label>
              <div class="d-flex flex-wrap gap-2">
                <input
                  type="radio"
                  class="btn-check"
                  name="duration"
                  id="d1"
                /><label
                  class="chip-select"
                  for="d1"
                  data-i18n="auth.onb.s1.d1"
                ></label>
                <input
                  type="radio"
                  class="btn-check"
                  name="duration"
                  id="d3"
                /><label
                  class="chip-select"
                  for="d3"
                  data-i18n="auth.onb.s1.d3"
                ></label>
                <input
                  type="radio"
                  class="btn-check"
                  name="duration"
                  id="d6"
                  checked
                /><label
                  class="chip-select"
                  for="d6"
                  data-i18n="auth.onb.s1.d6"
                ></label>
                <input
                  type="radio"
                  class="btn-check"
                  name="duration"
                  id="d12"
                /><label
                  class="chip-select"
                  for="d12"
                  data-i18n="auth.onb.s1.d12"
                ></label>
              </div>
            </div>
            <div class="col-md-5">
              <label
                class="form-label"
                for="moveIn"
                data-i18n="auth.onb.s1.moveIn"
              ></label>
              <input
                type="date"
                class="form-control"
                id="moveIn"
                value="2026-11-01"
              />
            </div>
          </div>
        </section>

        <!-- ===== الخطوة 2: وين بتروح ===== -->
        <section class="wizard-step" data-step="2">
          <span class="step-tag" data-i18n="auth.onb.step2"></span>
          <h1 class="h2" data-i18n="auth.onb.s2.title"></h1>
          <p class="text-muted mb-4" data-i18n="auth.onb.s2.sub"></p>

          <div class="search-input mb-3">
            <i class="bi bi-search"></i>
            <input
              type="search"
              class="form-control form-control-lg"
              id="placeSearch"
              data-i18n-placeholder="auth.onb.s2.searchPh"
            />
          </div>

          <div class="row g-4">
            <div class="col-md-6">
              <p
                class="small fw-semibold text-muted mb-2"
                data-i18n="auth.onb.s2.suggested"
              ></p>
              <div class="d-grid gap-2" id="placeList">
                <div>
                  <input
                    type="radio"
                    class="btn-check"
                    name="place"
                    id="p1"
                    value="p1"
                    checked
                  />
                  <label class="choice-card align-items-center py-2" for="p1">
                    <span class="ci"><i class="bi bi-mortarboard"></i></span>
                    <span
                      ><b data-i18n="auth.onb.s2.p1"></b
                      ><small data-i18n="auth.onb.s2.p1s"></small
                    ></span>
                  </label>
                </div>
                <div>
                  <input
                    type="radio"
                    class="btn-check"
                    name="place"
                    id="p2"
                    value="p2"
                  />
                  <label class="choice-card align-items-center py-2" for="p2">
                    <span class="ci"><i class="bi bi-mortarboard"></i></span>
                    <span
                      ><b data-i18n="auth.onb.s2.p2"></b
                      ><small data-i18n="auth.onb.s2.p2s"></small
                    ></span>
                  </label>
                </div>
                <div>
                  <input
                    type="radio"
                    class="btn-check"
                    name="place"
                    id="p3"
                    value="p3"
                  />
                  <label class="choice-card align-items-center py-2" for="p3">
                    <span class="ci"><i class="bi bi-hospital"></i></span>
                    <span
                      ><b data-i18n="auth.onb.s2.p3"></b
                      ><small data-i18n="auth.onb.s2.p3s"></small
                    ></span>
                  </label>
                </div>
                <div>
                  <input
                    type="radio"
                    class="btn-check"
                    name="place"
                    id="p4"
                    value="p4"
                  />
                  <label class="choice-card align-items-center py-2" for="p4">
                    <span class="ci"><i class="bi bi-briefcase"></i></span>
                    <span
                      ><b data-i18n="auth.onb.s2.p4"></b
                      ><small data-i18n="auth.onb.s2.p4s"></small
                    ></span>
                  </label>
                </div>
                <div>
                  <input
                    type="radio"
                    class="btn-check"
                    name="place"
                    id="p5"
                    value="p5"
                  />
                  <label class="choice-card align-items-center py-2" for="p5">
                    <span class="ci"><i class="bi bi-geo"></i></span>
                    <span
                      ><b data-i18n="auth.onb.s2.p5"></b
                      ><small data-i18n="auth.onb.s2.p5s"></small
                    ></span>
                  </label>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <p
                class="small fw-semibold text-muted mb-2"
                data-i18n="auth.onb.s2.orMap"
              ></p>
              <div class="map-mock" style="min-height: 300px">
                <span
                  class="map-area"
                  style="left: 46%; top: 48%; width: 150px; height: 150px"
                ></span>
                <span class="map-place" style="left: 46%; top: 48%"
                  ><i class="bi bi-mortarboard-fill"></i
                ></span>
              </div>
            </div>
          </div>
        </section>

        <!-- ===== الخطوة 3: الأولويات ===== -->
        <section class="wizard-step" data-step="3">
          <span class="step-tag" data-i18n="auth.onb.step3"></span>
          <h1 class="h2" data-i18n="auth.onb.s3.title"></h1>
          <p class="text-muted mb-4" data-i18n="auth.onb.s3.sub"></p>

          <div class="panel mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label
                class="form-label mb-0"
                for="budget"
                data-i18n="auth.onb.s3.budget"
              ></label>
              <b class="text-primary fs-5" id="budgetVal"
                >300 <span data-i18n="common.currency"></span
              ></b>
            </div>
            <input
              type="range"
              class="form-range"
              id="budget"
              min="100"
              max="800"
              step="10"
              value="300"
            />
          </div>

          <!-- القيم هون مقترحة لطالب. بالـ JS بتتغير حسب السبب اللي اختاره -->
          <div class="panel" id="priorities">
            <div class="priority">
              <label for="pr-price"
                ><i class="bi bi-cash-coin"></i
                ><span data-i18n="auth.onb.s3.price"></span
              ></label>
              <input
                type="range"
                class="form-range"
                id="pr-price"
                min="1"
                max="5"
                value="5"
              />
              <span class="prio-val" data-i18n="auth.onb.s3.l5"></span>
            </div>
            <div class="priority">
              <label for="pr-distance"
                ><i class="bi bi-geo-alt"></i
                ><span data-i18n="auth.onb.s3.distance"></span
              ></label>
              <input
                type="range"
                class="form-range"
                id="pr-distance"
                min="1"
                max="5"
                value="5"
              />
              <span class="prio-val" data-i18n="auth.onb.s3.l5"></span>
            </div>
            <div class="priority">
              <label for="pr-quiet"
                ><i class="bi bi-volume-mute"></i
                ><span data-i18n="auth.onb.s3.quiet"></span
              ></label>
              <input
                type="range"
                class="form-range"
                id="pr-quiet"
                min="1"
                max="5"
                value="4"
              />
              <span class="prio-val" data-i18n="auth.onb.s3.l4"></span>
            </div>
            <div class="priority">
              <label for="pr-access"
                ><i class="bi bi-universal-access"></i
                ><span data-i18n="auth.onb.s3.access"></span
              ></label>
              <input
                type="range"
                class="form-range"
                id="pr-access"
                min="1"
                max="5"
                value="2"
              />
              <span class="prio-val" data-i18n="auth.onb.s3.l2"></span>
            </div>
            <div class="priority">
              <label for="pr-ready"
                ><i class="bi bi-lightning-charge"></i
                ><span data-i18n="auth.onb.s3.ready"></span
              ></label>
              <input
                type="range"
                class="form-range"
                id="pr-ready"
                min="1"
                max="5"
                value="3"
              />
              <span class="prio-val" data-i18n="auth.onb.s3.l3"></span>
            </div>
            <div class="priority">
              <label for="pr-sharing"
                ><i class="bi bi-people"></i
                ><span data-i18n="auth.onb.s3.sharing"></span
              ></label>
              <input
                type="range"
                class="form-range"
                id="pr-sharing"
                min="1"
                max="5"
                value="3"
              />
              <span class="prio-val" data-i18n="auth.onb.s3.l3"></span>
            </div>
          </div>
        </section>

        <div class="wizard-nav justify-content-end">
          <a href="../seeker/search.html" class="btn btn-accent btn-lg"
            ><span data-i18n="auth.onb.finish"></span>
            <i class="bi bi-arrow-left dir-flip"></i
          ></a>
        </div>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/layout.js"></script>
  </body>
</html>
