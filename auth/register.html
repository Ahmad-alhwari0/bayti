<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bayti — إنشاء حساب</title>

    <link
      id="bootstrap-css"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <script src="../assets/i18n/ar.js"></script>
    <script src="../assets/i18n/en.js"></script>
    <script src="../assets/i18n/auth.i18n.js"></script>
    <script src="../assets/js/i18n.js"></script>
  </head>
  <body data-layout="auth">
    <main class="auth-wrap">
      <aside class="auth-side">
        <a class="brand" href="../index.html"
          ><span class="brand-mark">B</span><span data-i18n="brand"></span
        ></a>
        <div>
          <h2 data-i18n="auth.side.title"></h2>
          <ul class="list-unstyled d-grid gap-3 mt-4 mb-0">
            <li class="d-flex gap-2">
              <i class="bi bi-stars"></i><span data-i18n="auth.side.b1"></span>
            </li>
            <li class="d-flex gap-2">
              <i class="bi bi-receipt"></i
              ><span data-i18n="auth.side.b2"></span>
            </li>
            <li class="d-flex gap-2">
              <i class="bi bi-shield-check"></i
              ><span data-i18n="auth.side.b3"></span>
            </li>
          </ul>
        </div>
        <small class="opacity-75" data-i18n="auth.side.foot"></small>
      </aside>

      <section class="auth-main">
        <div class="auth-top">
          <a class="brand" href="../index.html"
            ><span class="brand-mark">B</span><span data-i18n="brand"></span
          ></a>
          <button
            type="button"
            class="btn btn-link nav-lang px-2"
            data-action="toggle-lang"
          >
            <i class="bi bi-translate"></i><span data-i18n="lang.switch"></span>
          </button>
        </div>

        <form class="auth-form" id="registerForm" action="onboarding.html">
          <h1 data-i18n="auth.register.title"></h1>
          <p class="text-muted mb-4" data-i18n="auth.register.sub"></p>

          <!-- نوع الحساب -->
          <label class="form-label" data-i18n="auth.register.iam"></label>
          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <input
                type="radio"
                class="btn-check"
                name="role"
                id="roleSeeker"
                value="seeker"
                checked
              />
              <label class="choice-card" for="roleSeeker">
                <span class="ci"><i class="bi bi-search-heart"></i></span>
                <span
                  ><b data-i18n="auth.register.seeker"></b
                  ><small data-i18n="auth.register.seekerSub"></small
                ></span>
              </label>
            </div>
            <div class="col-sm-6">
              <input
                type="radio"
                class="btn-check"
                name="role"
                id="roleOwner"
                value="owner"
              />
              <label class="choice-card" for="roleOwner">
                <span class="ci"><i class="bi bi-house-door"></i></span>
                <span
                  ><b data-i18n="auth.register.owner"></b
                  ><small data-i18n="auth.register.ownerSub"></small
                ></span>
              </label>
            </div>
          </div>

          <!-- مخفي هلأ (d-none). بمرحلة الـ JS بنخليه يظهر لما يختار "عندي عقار" -->
          <div class="mb-3 d-none" id="ownerType">
            <label
              class="form-label"
              data-i18n="auth.register.ownerType"
            ></label>
            <div class="d-flex flex-wrap gap-2">
              <input
                type="radio"
                class="btn-check"
                name="ownerType"
                id="otIndividual"
                checked
              />
              <label class="chip-select" for="otIndividual"
                ><i class="bi bi-person"></i
                ><span data-i18n="auth.register.individual"></span
              ></label>
              <input
                type="radio"
                class="btn-check"
                name="ownerType"
                id="otAgency"
              />
              <label class="chip-select" for="otAgency"
                ><i class="bi bi-building"></i
                ><span data-i18n="auth.register.agency"></span
              ></label>
            </div>
          </div>

          <div class="mb-3">
            <label
              class="form-label"
              for="name"
              data-i18n="auth.register.name"
            ></label>
            <input
              type="text"
              class="form-control"
              id="name"
              autocomplete="name"
              required
              data-i18n-placeholder="auth.register.namePh"
            />
          </div>
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label
                class="form-label"
                for="email"
                data-i18n="auth.login.email"
              ></label>
              <input
                type="email"
                class="form-control"
                id="email"
                autocomplete="email"
                required
                data-i18n-placeholder="auth.login.emailPh"
              />
            </div>
            <div class="col-sm-6">
              <label
                class="form-label"
                for="phone"
                data-i18n="auth.register.phone"
              ></label>
              <input
                type="tel"
                class="form-control"
                id="phone"
                autocomplete="tel"
                dir="ltr"
                placeholder="07X XXX XXXX"
              />
            </div>
            <div class="col-12 mt-1">
              <small class="text-muted"
                ><i class="bi bi-lock"></i>
                <span data-i18n="auth.register.phoneHint"></span
              ></small>
            </div>
          </div>
          <div class="mb-3">
            <label
              class="form-label"
              for="password"
              data-i18n="auth.login.password"
            ></label>
            <input
              type="password"
              class="form-control"
              id="password"
              autocomplete="new-password"
              required
              data-i18n-placeholder="auth.login.passwordPh"
            />
          </div>
          <div class="form-check mb-4">
            <input
              class="form-check-input"
              type="checkbox"
              id="terms"
              required
            />
            <label
              class="form-check-label small"
              for="terms"
              data-i18n="auth.register.terms"
            ></label>
          </div>

          <button
            type="submit"
            class="btn btn-accent btn-lg w-100"
            data-i18n="auth.register.submit"
          ></button>

          <p class="text-center small mt-4 mb-0">
            <span
              class="text-muted"
              data-i18n="auth.register.haveAccount"
            ></span>
            <a
              href="login.html"
              class="fw-semibold"
              data-i18n="auth.register.login"
            ></a>
          </p>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/layout.js"></script>
  </body>
</html>
