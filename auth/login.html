<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bayti — تسجيل الدخول</title>

    <link
      id="bootstrap-css"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <script src="../assets/i18n/ar.js"></script>
    <script src="../assets/i18n/en.js"></script>
    <script src="../assets/i18n/auth.i18n.js"></script>
    <script src="../assets/js/i18n.js"></script>
  </head>
  <body data-layout="auth">
    <main class="auth-wrap">
      <!-- الجهة الملونة (ديسكتوب بس) -->
      <aside class="auth-side">
        <a class="brand" href="../index.html"
          ><span class="brand-mark">B</span><span data-i18n="brand"></span
        ></a>
        <div>
          <h2 data-i18n="auth.side.title"></h2>
          <p class="mb-4" data-i18n="auth.side.text"></p>
          <div
            class="auth-quote d-flex align-items-center gap-3"
            style="max-width: 380px"
          >
            <span
              class="ph ph-1 rounded-3 flex-shrink-0"
              style="width: 64px; height: 64px"
            ></span>
            <div class="flex-grow-1">
              <b class="d-block" data-i18n="auth.side.cardTitle"></b>
              <small class="opacity-75" data-i18n="auth.side.cardText"></small>
            </div>
            <div class="score-ring" style="--value: 92; --size: 54px">
              <div class="score-ring__inner">92</div>
            </div>
          </div>
        </div>
        <small class="opacity-75" data-i18n="auth.side.foot"></small>
      </aside>

      <!-- الفورم -->
      <section class="auth-main">
        <div class="auth-top">
          <a class="brand" href="../index.html"
            ><span class="brand-mark">B</span><span data-i18n="brand"></span
          ></a>
          <button
            type="button"
            class="btn btn-link nav-lang px-2"
            data-action="toggle-lang"
          >
            <i class="bi bi-translate"></i><span data-i18n="lang.switch"></span>
          </button>
        </div>

        <!-- action: لوين بتروح الفورم لما تكبس تسجيل الدخول. required على الحقول = المتصفح بيتأكد إنها مش فاضية -->
        <form class="auth-form" id="loginForm" action="../seeker/search.html">
          <h1 data-i18n="auth.login.title"></h1>
          <p class="text-muted mb-4" data-i18n="auth.login.sub"></p>

          <div class="mb-3">
            <label
              class="form-label"
              for="email"
              data-i18n="auth.login.email"
            ></label>
            <div class="input-icon">
              <i class="bi bi-envelope"></i>
              <input
                type="email"
                class="form-control"
                id="email"
                autocomplete="email"
                required
                data-i18n-placeholder="auth.login.emailPh"
              />
            </div>
          </div>

          <div class="mb-2">
            <label
              class="form-label"
              for="password"
              data-i18n="auth.login.password"
            ></label>
            <div class="input-icon position-relative">
              <i class="bi bi-lock"></i>
              <input
                type="password"
                class="form-control pe-5"
                id="password"
                autocomplete="current-password"
                required
                data-i18n-placeholder="auth.login.passwordPh"
              />
              <!-- زر العين: بنشغّله سوا بمرحلة الـ JS -->
              <button
                type="button"
                class="btn btn-link position-absolute top-50 translate-middle-y text-muted"
                style="inset-inline-end: 0.25rem"
                data-toggle-password="password"
                data-i18n-aria="auth.login.show"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="remember"
                checked
              />
              <label
                class="form-check-label small"
                for="remember"
                data-i18n="auth.login.remember"
              ></label>
            </div>
            <a href="#" class="small" data-i18n="auth.login.forgot"></a>
          </div>

          <button
            type="submit"
            class="btn btn-accent btn-lg w-100"
            data-i18n="auth.login.submit"
          ></button>

          <div class="divider-text">
            <span data-i18n="auth.login.or"></span>
          </div>

          <button
            type="button"
            class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2"
          >
            <i class="bi bi-google"></i
            ><span data-i18n="auth.login.google"></span>
          </button>

          <p class="text-center small mt-4 mb-2">
            <span class="text-muted" data-i18n="auth.login.noAccount"></span>
            <a
              href="register.html"
              class="fw-semibold"
              data-i18n="auth.login.create"
            ></a>
          </p>

          <!-- للعرض قدام اللجنة: دخول سريع لكل دور -->
          <div class="text-center small text-muted border-top pt-3 mt-3">
            <span data-i18n="auth.login.demo"></span>
            <a
              href="../seeker/search.html"
              class="mx-1"
              data-i18n="roles.seeker"
            ></a
            >·
            <a
              href="../owner/dashboard.html"
              class="mx-1"
              data-i18n="roles.owner"
            ></a
            >·
            <a
              href="../admin/dashboard.html"
              class="mx-1"
              data-i18n="roles.admin"
            ></a>
          </div>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/layout.js"></script>
  </body>
</html>
