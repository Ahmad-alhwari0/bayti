<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bayti — Forgot password</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <main class="auth-wrap">
      <aside class="auth-side">
        <a class="brand" href="../index.html"
          ><span class="brand-mark">B</span><span>Bayti</span
        ></a>
        <div>
          <h2>It happens to everyone</h2>
          <p class="mb-0">We’ll email you a code so you can choose a new password.</p>
        </div>
        <small class="opacity-75">Verified homes across Jordan</small>
      </aside>

      <section class="auth-main">
        <div class="auth-top">
          <a class="brand" href="../index.html"
            ><span class="brand-mark">B</span><span>Bayti</span
          ></a>
        </div>

        <!-- Step 1 of 2: email a 6-digit code, then go to reset-password.html -->
        <form
          class="auth-form"
          id="forgotForm"
          action="reset-password.html"
          method="post"
        >
          <span class="feature-icon"><i class="bi bi-key"></i></span>
          <h1>Forgot your password?</h1>
          <p class="text-muted mb-4">
            Enter the email on your account and we’ll send you a 6-digit code.
          </p>

          <div class="mb-4">
            <label class="form-label" for="email">Email</label>
            <div class="input-icon">
              <i class="bi bi-envelope"></i>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                autocomplete="email"
                required
                placeholder="name@example.com"
              />
            </div>
          </div>

          <button type="submit" class="btn btn-accent btn-lg w-100">
            Send code
          </button>

          <p class="text-center small mt-4 mb-0">
            <a href="login.html" class="fw-semibold"
              ><i class="bi bi-arrow-left"></i> Back to log in</a
            >
          </p>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
